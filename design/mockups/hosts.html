<body>
<header class="page-header">
  <h1>2 · Hosts</h1>
  <nav class="crumbs"><a href="first-run.html">← First run</a><a href="index.html">All screens</a><a href="home.html">Next: Home →</a></nav>
  <span class="spacer"></span>
  <div class="appearance"></div>
</header>
<div class="intro">
  <p>The Macs this iPhone is paired with. With one host the app opens straight into it; Hosts is reached from the host name at the top of <a href="home.html">Home</a> or from <a href="usage-settings.html">Settings</a>. Each row says how the phone reaches that Mac right now.</p>
</div>
<main class="gallery">

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span class="back"><svg class="i"><use href="#i-back"/></svg>Studio Mac</span></div><div></div><div class="trail"><svg class="i"><use href="#i-plus"/></svg></div></div>
        <div class="large-title">Hosts</div>
        <div class="content">
          <div class="section-head">Paired</div>
          <div class="list">
            <div class="row has-icon">
              <span class="icon-tile cyan"><svg class="i"><use href="#i-mac"/></svg></span>
              <div class="main">Studio Mac<span class="state green"><svg class="i"><use href="#i-wifi"/></svg>On Wi-Fi</span></div>
              <svg class="i current-mark"><use href="#i-check"/></svg>
            </div>
            <div class="row has-icon">
              <span class="icon-tile cyan"><svg class="i"><use href="#i-mac"/></svg></span>
              <div class="main">Office mini<span class="state cyan"><svg class="i"><use href="#i-vpn"/></svg>Via Tailscale</span></div>
              <span class="badge">1</span>
              <svg class="i chev"><use href="#i-chev"/></svg>
            </div>
            <div class="row has-icon">
              <span class="icon-tile"><svg class="i"><use href="#i-mac"/></svg></span>
              <div class="main">MacBook Air<span class="state subtle"><svg class="i"><use href="#i-offline"/></svg>Unreachable · last seen 3 days ago</span></div>
              <svg class="i chev"><use href="#i-chev"/></svg>
            </div>
          </div>
          <div class="section-foot">Badges count what needs you on each Mac. Swipe a host to remove it.</div>

          <div class="section-head">Explore</div>
          <div class="list">
            <div class="row has-icon">
              <span class="icon-tile"><svg class="i"><use href="#i-demo"/></svg></span>
              <div class="main">Demo host<span class="sub">Sample projects, no Mac needed</span></div>
              <svg class="i chev"><use href="#i-chev"/></svg>
            </div>
          </div>

          <div class="section-head">&nbsp;</div>
          <div class="list">
            <div class="row action has-icon"><span class="icon-tile accent"><svg class="i"><use href="#i-qr"/></svg></span><div class="main">Add a Mac</div></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>Paired hosts</b>Checkmark is the host you are in. Connection state is a glyph plus words, never colour alone: On Wi-Fi, Via Tailscale (or “Via VPN” for other VPNs), Unreachable with when it was last seen.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span class="back"><svg class="i"><use href="#i-back"/></svg>Studio Mac</span></div><div></div><div class="trail"><svg class="i"><use href="#i-plus"/></svg></div></div>
        <div class="large-title">Hosts</div>
        <div class="content">
          <div class="section-head">Paired</div>
          <div class="list">
            <div class="row has-icon">
              <span class="icon-tile cyan"><svg class="i"><use href="#i-mac"/></svg></span>
              <div class="main">Studio Mac<span class="state green"><svg class="i"><use href="#i-wifi"/></svg>On Wi-Fi</span></div>
              <svg class="i current-mark"><use href="#i-check"/></svg>
            </div>
            <div class="swipe">
              <div class="actions"><span class="act-red"><svg class="i"><use href="#i-trash"/></svg>Remove</span></div>
              <div class="row has-icon" style="border-top:0.5px solid var(--edge)">
                <span class="icon-tile cyan"><svg class="i"><use href="#i-mac"/></svg></span>
                <div class="main">Office mini<span class="state cyan"><svg class="i"><use href="#i-vpn"/></svg>Via Tailscale</span></div>
                <span class="badge">1</span>
              </div>
            </div>
            <div class="row has-icon">
              <span class="icon-tile"><svg class="i"><use href="#i-mac"/></svg></span>
              <div class="main">MacBook Air<span class="state subtle"><svg class="i"><use href="#i-offline"/></svg>Unreachable · last seen 3 days ago</span></div>
              <svg class="i chev"><use href="#i-chev"/></svg>
            </div>
          </div>
        </div>
        <div class="scrim"></div>
        <div class="action-sheet">
          <div class="group">
            <div class="msg"><b style="color:var(--text)">Remove Office mini?</b><br>This iPhone forgets its key. To use it again, scan a new QR code on that Mac. The Mac still lists this iPhone until you remove it there too.</div>
            <div class="destructive">Remove Office mini</div>
          </div>
          <div class="group"><div class="cancel">Cancel</div></div>
        </div>
      </div>
    </div>
    <figcaption><b>Swipe to remove</b>Trailing swipe shows Remove, which confirms with an action sheet that says what happens on each side.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span class="back"><svg class="i"><use href="#i-back"/></svg>Hosts</span></div><div class="title">MacBook Air</div><div class="trail"></div></div>
        <div class="content">
          <div class="card" style="margin-top:12px;text-align:center;padding:22px 18px">
            <div style="font-size:34px;color:var(--subtle)"><svg class="i"><use href="#i-offline"/></svg></div>
            <h3 style="margin-top:6px">Can't reach MacBook Air</h3>
            <div class="meta" style="font-size:15px;margin-top:4px">Last seen 3 days ago, on Wi-Fi.</div>
            <div style="margin-top:14px"><button class="btn tinted small" style="margin:0 auto">Try again</button></div>
          </div>
          <div class="section-head">Addresses tried</div>
          <div class="list">
            <div class="row"><div class="main">192.168.1.31<span class="sub">Wi-Fi · no answer</span></div></div>
            <div class="row"><div class="main">macbook-air.ts.net<span class="sub">Tailscale · no answer</span></div></div>
          </div>
          <div class="section-head">Things to check</div>
          <div class="list">
            <div class="row"><div class="main">Is the Mac awake, with Wiffletree open and remote access on?</div></div>
            <div class="row"><div class="main">Away from home? Turn on Tailscale or your VPN on this iPhone.</div></div>
          </div>
          <div class="section-head">This host</div>
          <div class="list">
            <div class="row"><div class="main">Access</div><span class="value">Control</span></div>
            <div class="row"><div class="main">Mac key</div><span class="value mono">a81e·07d3</span></div>
          </div>
          <div class="section-head">&nbsp;</div>
          <div class="list"><div class="row destructive">Remove MacBook Air</div></div>
        </div>
      </div>
    </div>
    <figcaption><b>Unreachable host</b>Shows what the phone tried and the two usual causes, instead of a spinner. Tailscale is mentioned but never required.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span class="back"><svg class="i"><use href="#i-back"/></svg>Studio Mac</span></div></div>
        <div class="large-title">Hosts</div>
        <div class="scrim"></div>
        <div class="sheet">
          <div class="grabber"></div>
          <div class="nav"><div class="lead"><span>Cancel</span></div><div class="title">Add a Mac</div><div class="trail"></div></div>
          <div style="padding:22px 24px 8px;display:flex;flex-direction:column;gap:18px">
            <div class="points">
              <div><span class="badge accent step">1</span><p style="margin:0"><b>Open Wiffletree on the Mac</b><span>Download it from GitHub Releases if it isn't there yet.</span></p></div>
              <div><span class="badge accent step">2</span><p style="margin:0"><b>Settings › Remote access</b><span>Turn on “Let other devices use this Mac's Wiffletree”.</span></p></div>
              <div><span class="badge accent step">3</span><p style="margin:0"><b>Choose Connect a phone</b><span>A QR code appears. Scan it here.</span></p></div>
            </div>
            <button class="btn filled"><svg class="i"><use href="#i-qr"/></svg>Scan QR code</button>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>Add host</b>The + button opens a sheet with the three steps on the Mac, then the same camera as first run.</figcaption>
  </figure>
