<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · First run · Wiffletree iPhone mockups</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
  <h1>1 · First run</h1>
  <nav class="crumbs"><a href="index.html">All screens</a><a href="hosts.html">Next: Hosts →</a></nav>
  <span class="spacer"></span>
  <div class="appearance"></div>
</header>
<div class="intro">
  <p>From opening the app to a paired Mac. Scan QR code asks for local network access first, explains why, then opens the camera. Try a demo skips all of it and opens the built-in demo host (see <a href="demo.html">9 · Demo mode</a>).</p>
</div>
<main class="gallery">

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="welcome">
          <div class="hero">
            <svg class="symbol"><use href="#i-symbol"/></svg>
            <h1>Wiffletree</h1>
            <p>Answer your coordinators, follow tickets and approve pull requests from your iPhone. Your Mac does the work.</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <button class="btn filled"><svg class="i"><use href="#i-qr"/></svg>Scan QR code</button>
            <button class="btn gray"><svg class="i"><use href="#i-demo"/></svg>Try a demo</button>
          </div>
          <div class="note">
            <svg class="i"><use href="#i-vpn"/></svg>
            <span>At home it connects over Wi-Fi. Away from home it works over Tailscale or any VPN you already use. No account, and no servers of ours in between.</span>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>Welcome</b>One primary action, one secondary. The VPN note sets the expectation before anyone asks “does it work on 5G?”.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span>Cancel</span></div></div>
        <div class="explainer">
          <div class="art"><svg class="i"><use href="#i-network"/></svg></div>
          <h2>Find your Mac on this network</h2>
          <p>Next, iOS asks whether Wiffletree may use your local network. Allow it so your iPhone can reach your Mac.</p>
          <div class="points">
            <div><svg class="i"><use href="#i-lock"/></svg><p style="margin:0"><b>Only Macs you pair</b><span>The QR code carries your Mac's key. Wiffletree talks to that Mac and nothing else.</span></p></div>
            <div><svg class="i"><use href="#i-eye"/></svg><p style="margin:0"><b>Nothing collected</b><span>No account and no analytics. Traffic is encrypted between your iPhone and your Mac.</span></p></div>
            <div><svg class="i"><use href="#i-vpn"/></svg><p style="margin:0"><b>Away from home</b><span>Turn on Tailscale or your VPN on both devices. Wiffletree tries every address it knows.</span></p></div>
          </div>
          <button class="btn filled">Continue</button>
        </div>
      </div>
    </div>
    <figcaption><b>Local network explainer</b>Shown once, before the system prompt, because iOS gives one chance to ask. Cancel returns to Welcome.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"><span>Cancel</span></div></div>
        <div class="explainer">
          <div class="art"><svg class="i"><use href="#i-network"/></svg></div>
          <h2>Find your Mac on this network</h2>
          <p>Next, iOS asks whether Wiffletree may use your local network. Allow it so your iPhone can reach your Mac.</p>
        </div>
        <div class="scrim"></div>
        <div class="alert">
          <div class="body">
            <b>“Wiffletree” would like to find and connect to devices on your local network.</b>
            <p>Wiffletree connects to the Wiffletree app on Macs you pair with this iPhone.</p>
          </div>
          <div class="buttons"><span>Don't Allow</span><span>Allow</span></div>
        </div>
      </div>
    </div>
    <figcaption><b>System prompt</b>iOS draws this; the second line is our <code>NSLocalNetworkUsageDescription</code>. If denied, the camera still opens and a Hosts row later explains how to allow it in Settings.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone camera" data-locked-theme="dark">
        <div class="nav">
          <div class="lead"><span class="round-button"><svg class="i"><use href="#i-x"/></svg></span></div>
          <div class="title" style="color:var(--paper)">Scan the QR code</div>
          <div class="trail"></div>
        </div>
        <div class="viewfinder">
          <div class="fake-qr"></div>
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        </div>
        <div style="position:absolute;left:32px;right:32px;top:590px;text-align:center;color:var(--paper);font-size:15px;line-height:1.45">
          On your Mac, open Wiffletree, go to <b>Settings › Remote access</b> and choose <b>Connect a phone</b>.
        </div>
        <div style="position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center">
          <span class="round-button large"><svg class="i"><use href="#i-flash"/></svg></span>
        </div>
      </div>
    </div>
    <figcaption><b>Scan QR code</b>Camera view with a framing square; the code locks in as soon as it is inside. Always dark, as the iOS camera is. The QR code is valid once, for 2 minutes.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="camera" style="position:absolute;inset:0;opacity:.6"></div>
        <div class="scrim"></div>
        <div class="sheet">
          <div class="grabber"></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 24px 18px;text-align:center">
            <span class="icon-tile" style="width:56px;height:56px;border-radius:14px;font-size:30px"><svg class="i"><use href="#i-mac"/></svg></span>
            <div style="font-size:22px;font-weight:700;margin-top:6px">Pair with Studio Mac?</div>
            <div class="meta" style="font-size:15px">This iPhone will appear on the Mac as <b style="color:var(--text)">Michael's iPhone</b>.</div>
          </div>
          <div class="list">
            <div class="row"><div class="main">Mac key</div><span class="value mono">4f2a·91c0</span></div>
            <div class="row"><div class="main">On Wi-Fi</div><span class="value">192.168.1.20</span></div>
            <div class="row"><div class="main">Via Tailscale</div><span class="value">studio-mac.ts.net</span></div>
          </div>
          <div class="section-foot">Check that the key matches the one under the QR code on your Mac.</div>
          <div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:6px">
            <button class="btn filled">Pair</button>
            <button class="btn plain">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>Confirm pairing</b>A sheet over the camera once the code is read. It shows what the QR code said: the host's name, the short key id and the addresses the phone will race.</figcaption>
  </figure>

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="explainer">
          <div class="art" style="background:var(--tint-green);color:var(--green)"><svg class="i"><use href="#i-check"/></svg></div>
          <h2>Studio Mac is paired</h2>
          <p>Your Mac gave this iPhone <b style="color:var(--text)">Control</b>: anything you can do in Wiffletree on the Mac, you can do here.</p>
          <div class="list" style="margin:0 0 12px">
            <div class="row">
              <div class="main">Tell me when a coordinator needs me<span class="sub">A short alert through your iCloud. The details load only when you open the app.</span></div>
              <span class="switch on"></span>
            </div>
          </div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
            <button class="btn filled">Open Studio Mac</button>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>Paired</b>Names the access level the Mac granted and asks for notifications here, in context, not at launch. Turning the switch on shows the iOS notification prompt.</figcaption>
  </figure>

</main>
<script src="mockup.js"></script>
</body>
</html>
