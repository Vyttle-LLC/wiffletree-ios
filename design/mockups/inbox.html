<div class="intro">
  <p>Everything a coordinator escalated to you, across the host's projects: questions with their choices, and approvals to publish or merge a pull request. Answering here is the same as answering on the Mac.</p>

<main class="gallery">

  <figure class="shot">
    <div class="phones">
      <div class="phone">
        <div class="nav"><div class="lead"></div><div></div><div class="trail"></div></div>

          <div class="ask">
            <div class="from"><svg class="i"><use href="#i-question"/></svg>Station map · Coordinator<span class="meta">12 min</span></div>
            <div class="q">Which map tiles should the station page use?</div>
            <div class="detail">Both are free for this volume. Apple Maps needs no key on iOS; the web page would need a token.</div>
            <div class="options">
              <div class="opt">OpenStreetMap<small>Same tiles on web and app</small></div>
              <div class="opt">Apple Maps<small>Native look, token for the web</small></div>
            </div>
            <div class="answer-own">Answer in your own words…</div>
          </div>

            <div class="q">Publish “Store alert thresholds per station”?</div>
            <div class="detail">Review passed. Wiffletree pushes <span class="mono">wiffletree/store-alert-thresholds</span> and opens a pull request on Vyttle-LLC/tidepool.</div>
            <div class="btn-row"><button class="btn gray small" style="flex:1">Deny</button><button class="btn filled small" style="flex:1">Approve</button></div>
          </div>

          <div class="ask">
            <div class="from"><svg class="i"><use href="#i-merge"/></svg>Flaky sync test · Merge<span class="meta">1 h</span></div>
            <div class="q">Merge #212 into main?</div>
            <div class="detail">Checks passed · 1 approval · squash merge.</div>
            <div class="btn-row"><button class="btn gray small" style="flex:1">Deny</button><button class="btn filled small" style="flex:1">Merge</button></div>
          </div>
        </div>
        <div class="tabbar">
